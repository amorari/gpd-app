name: GPD Update Download Page

on:
  release:
    types: [published]
  # Manual rerun when the release:published hook did not fire — e.g.,
  # publish was done via gh release edit --draft=false (REST path) with
  # the repo configured to skip release events, or we want to force a
  # regen after a gh-pages edit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-download-page:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'gpd-desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # For release:published events, GITHUB_REF_NAME is the tag
          # (gpd-desktop-v1.2.3). For workflow_dispatch, GITHUB_REF_NAME
          # is the branch (gpd) — not what we want. In that case query
          # the GitHub API for the latest published gpd-desktop-v*
          # release.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(gh api /repos/${{ github.repository }}/releases \
              --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("gpd-desktop-v")))] | sort_by(.published_at) | reverse | .[0].tag_name // ""')
            if [ -z "$TAG" ]; then
              echo "::error::no published gpd-desktop-v* release found"
              exit 1
            fi
          fi
          VERSION="${TAG#gpd-desktop-v}"
          # Guard against the empty-string case (no prefix match) that
          # previously silently wrote `const VERSION = 'gpd'` into
          # index.html.
          case "$VERSION" in
            ''|gpd|gpd-*)
              echo "::error::refusing to update download page — resolved VERSION='$VERSION' is not a semver-shaped release (tag=$TAG)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved VERSION=$VERSION (tag=$TAG)"

      - name: Update version in download page
        run: |
          sed -i "s/const VERSION = '[^']*'/const VERSION = '${{ steps.version.outputs.version }}'/" index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update download page to v${{ steps.version.outputs.version }}"
          git push
