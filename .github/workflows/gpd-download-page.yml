name: GPD Update Download Page

on:
  release:
    types: [published]
  # Manual rerun when the release:published hook did not fire — e.g.,
  # publish was done via gh release edit --draft=false (REST path) with
  # the repo configured to skip release events, or we want to force a
  # regen after a gh-pages edit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-download-page:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'gpd-desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#gpd-desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Update version in download page
        run: |
          sed -i "s/const VERSION = '[^']*'/const VERSION = '${{ steps.version.outputs.version }}'/" index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update download page to v${{ steps.version.outputs.version }}"
          git push
