name: GPD Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (leave empty to auto-detect)"
        required: false
        type: string
      version_source:
        description: "Where to read version from (ignored if version is set)"
        required: false
        type: choice
        default: github
        options:
          - github
          - pypi
          - npm

permissions:
  contents: write
  actions: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            SOURCE="${{ inputs.version_source || 'pypi' }}"
            echo "Auto-detecting version from: $SOURCE"
            case "$SOURCE" in
              pypi)
                VERSION=$(curl -s https://pypi.org/pypi/get-physics-done/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
                ;;
              github)
                VERSION=$(gh api repos/psi-oss/get-physics-done/contents/pyproject.toml --jq '.content' | base64 -d | grep '^version' | head -1 | grep -oP '"\K[^"]+')
                ;;
              npm)
                VERSION=$(curl -s https://registry.npmjs.org/get-physics-done | python3 -c "import sys,json; print(json.load(sys.stdin)['dist-tags']['latest'])")
                ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE:-manual}" >> "$GITHUB_OUTPUT"
          echo "Resolved GPD version: $VERSION (source: ${SOURCE:-manual})"

  build-cli:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install
      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist/opencode-*

  build-desktop:
    needs: [resolve-version, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm
          - host: macos-latest
            target: x86_64-apple-darwin
            label: mac-intel
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install

      - name: Prepare sidecars
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENCODE_CLI_ARTIFACT: opencode-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build GPD sidecar (PyInstaller)
        shell: bash
        run: |
          if [ "${{ needs.resolve-version.outputs.source }}" = "github" ]; then
            pip install "get-physics-done[arxiv] @ git+https://github.com/psi-oss/get-physics-done.git@main" pyinstaller
          else
            pip install "get-physics-done[arxiv]" pyinstaller
          fi
          cd /tmp
          PYTHONPATH=$(python -c "import gpd; import os; print(os.path.dirname(os.path.dirname(gpd.__file__)))")
          python $PYTHONPATH/gpd/../../../scripts/gpd/generate_pyinstaller_imports.py > /tmp/hidden-imports.txt 2>/dev/null || true
          pyinstaller --onedir --name gpd-sidecar --console \
            --add-data "$(python -c 'import gpd; import os; print(os.path.dirname(gpd.__file__))'):gpd" \
            --copy-metadata mcp \
            --hidden-import=diskcache \
            --hidden-import=mcp --hidden-import=mcp.server --hidden-import=mcp.server.fastmcp \
            --hidden-import=pydantic --hidden-import=yaml --hidden-import=jinja2 \
            --hidden-import=typer --hidden-import=rich \
            --hidden-import=gpd.mcp.servers.conventions_server \
            --hidden-import=gpd.mcp.servers.errors_mcp \
            --hidden-import=gpd.mcp.servers.patterns_server \
            --hidden-import=gpd.mcp.servers.protocols_server \
            --hidden-import=gpd.mcp.servers.skills_server \
            --hidden-import=gpd.mcp.servers.state_server \
            --hidden-import=gpd.mcp.servers.verification_server \
            --hidden-import=gpd.mcp.servers.arxiv_bridge \
            --hidden-import=gpd.adapters.opencode \
            $(python -c "import gpd.cli; print(gpd.cli.__file__)")
          # Copy to Tauri resources
          cp -R /tmp/dist/gpd-sidecar $GITHUB_WORKSPACE/packages/desktop/src-tauri/gpd-sidecar-bundle/
          echo "GPD sidecar built: $(du -sh /tmp/dist/gpd-sidecar | cut -f1)"

      # Linux AppImage workaround (same as upstream publish.yml)
      - name: Resolve tauri portable SHA
        if: runner.os == 'Linux'
        run: echo "TAURI_PORTABLE_SHA=$(git ls-remote https://github.com/tauri-apps/tauri.git refs/heads/feat/truly-portable-appimage | cut -f1)" >> "$GITHUB_ENV"

      - name: Install tauri-cli from portable appimage branch
        uses: taiki-e/cache-cargo-install-action@v3
        if: runner.os == 'Linux'
        with:
          tool: tauri-cli
          git: https://github.com/tauri-apps/tauri
          rev: ${{ env.TAURI_PORTABLE_SHA }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          tauriScript: ${{ (runner.os == 'Linux' && 'cargo tauri') || '' }}
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json
          tagName: gpd-desktop-v${{ needs.resolve-version.outputs.version }}
          releaseName: "GPD v${{ needs.resolve-version.outputs.version }}"
          releaseBody: "GPD Desktop App v${{ needs.resolve-version.outputs.version }} — Physics Research Workspace by PSI"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  update-download-page:
    needs: [resolve-version, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Update version in download page
        run: |
          sed -i "s/const VERSION = '[^']*'/const VERSION = '${{ needs.resolve-version.outputs.version }}'/" index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update download page to v${{ needs.resolve-version.outputs.version }}"
          git push
