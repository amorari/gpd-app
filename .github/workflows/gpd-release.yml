name: GPD Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (leave empty to auto-detect)"
        required: false
        type: string
      version_source:
        description: "Where to read version from (ignored if version is set)"
        required: false
        type: choice
        default: github
        options:
          - github
          - pypi
          - npm
      allow_placeholder_tos:
        description: "DEV ONLY: bypass the TOS placeholder guard. Paper trail only — every dispatch records who used this."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  tos-guard:
    name: Block placeholder TOS from shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if TOS text or version is placeholder
        run: |
          set -euo pipefail
          if [ "${{ inputs.allow_placeholder_tos }}" = "true" ]; then
            echo "::warning::TOS placeholder guard BYPASSED by ${{ github.actor }}. For dev / internal distribution only. Do NOT ship this build to external users."
            exit 0
          fi
          TOS=packages/app/src/components/tos-content.tsx
          if ! test -f "$TOS"; then
            echo "::error::$TOS missing — cannot release without TOS content"
            exit 1
          fi
          # (a) version constant must not indicate a non-final draft
          VER=$(grep -oP 'CURRENT_TOS_VERSION = "\K[^"]+' "$TOS" || echo "")
          if [ -z "$VER" ]; then
            echo "::error::CURRENT_TOS_VERSION not found in $TOS"
            exit 1
          fi
          case "$VER" in
            *placeholder*|*PLACEHOLDER*|*draft*|*DRAFT*|*dev*|*DEV*|0.0*)
              echo "::error::CURRENT_TOS_VERSION='$VER' looks like a placeholder/draft. Bump to a legal-reviewed version string (e.g. 1.0) before releasing."
              exit 1
              ;;
          esac
          # (b) TOS_TEXT must not contain the sentinel
          if grep -qE "PLACEHOLDER|DO NOT SHIP" "$TOS"; then
            echo "::error::$TOS contains PLACEHOLDER / DO NOT SHIP sentinel. Replace with legal-reviewed TOS text before releasing."
            grep -nE "PLACEHOLDER|DO NOT SHIP" "$TOS" || true
            exit 1
          fi
          # (c) TOS_TEXT_SHA256 + PRIVACY_TEXT_SHA256 constants must match
          # their actual text hashes. These are the client-side commitments
          # POSTed with every acceptance; stale constants would corrupt
          # server-side audit records.
          HASHES=$(python3 - <<'PY'
import re, pathlib, hashlib
src = pathlib.Path("packages/app/src/components/tos-content.tsx").read_text()
tos = re.search(r"export const TOS_TEXT = `([^`]+)`", src)
priv = re.search(r"export const PRIVACY_TEXT = `([^`]+)`", src)
if not tos or not priv:
    raise SystemExit("TOS_TEXT / PRIVACY_TEXT template literal not found")
print(hashlib.sha256(tos.group(1).encode("utf-8")).hexdigest())
print(hashlib.sha256(priv.group(1).encode("utf-8")).hexdigest())
PY
)
          SHIPPED_TOS_SHA=$(echo "$HASHES" | sed -n '1p')
          SHIPPED_PRIV_SHA=$(echo "$HASHES" | sed -n '2p')
          CONST_TOS_SHA=$(grep -oP 'TOS_TEXT_SHA256 =\s*\n?\s*"\K[0-9a-f]{64}' packages/app/src/components/tos-content.tsx || echo "")
          CONST_PRIV_SHA=$(grep -oP 'PRIVACY_TEXT_SHA256 =\s*\n?\s*"\K[0-9a-f]{64}' packages/app/src/components/tos-content.tsx || echo "")
          if [ -z "$CONST_TOS_SHA" ] || [ -z "$CONST_PRIV_SHA" ]; then
            echo "::error::TOS_TEXT_SHA256 and/or PRIVACY_TEXT_SHA256 constants missing/malformed in tos-content.tsx"
            exit 1
          fi
          if [ "$CONST_TOS_SHA" != "$SHIPPED_TOS_SHA" ]; then
            echo "::error::TOS_TEXT_SHA256 constant ($CONST_TOS_SHA) stale; actual text hashes to $SHIPPED_TOS_SHA. Update + commit."
            exit 1
          fi
          if [ "$CONST_PRIV_SHA" != "$SHIPPED_PRIV_SHA" ]; then
            echo "::error::PRIVACY_TEXT_SHA256 constant ($CONST_PRIV_SHA) stale; actual text hashes to $SHIPPED_PRIV_SHA. Update + commit."
            exit 1
          fi

          # (d) canonical legal texts must exist on disk with matching SHAs
          for pair in "TOS:$SHIPPED_TOS_SHA" "PRIVACY:$SHIPPED_PRIV_SHA"; do
            DOC="${pair%%:*}"
            WANT_SHA="${pair##*:}"
            LEGAL=infra/legal/${DOC}-v${VER}.md
            if ! test -f "$LEGAL"; then
              echo "::error::Missing canonical legal text at $LEGAL. Commit the legal-reviewed markdown so acceptance rows can be audited back to the exact terms."
              exit 1
            fi
            GOT_SHA=$(python3 -c "import hashlib,pathlib; print(hashlib.sha256(pathlib.Path('$LEGAL').read_text().encode('utf-8')).hexdigest())")
            if [ "$GOT_SHA" != "$WANT_SHA" ]; then
              echo "::error::${DOC} SHA256 ($WANT_SHA) does not match $LEGAL ($GOT_SHA). User-shipped and legal-reviewed docs have diverged."
              exit 1
            fi
          done
          echo "✓ TOS v$VER passes placeholder + text-hash guards"
          echo "    tos_text_sha256=$SHIPPED_TOS_SHA"
          echo "    privacy_text_sha256=$SHIPPED_PRIV_SHA"

  resolve-version:
    needs: tos-guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      sidecar_version: ${{ steps.version.outputs.sidecar_version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Always resolve the sidecar (get-physics-done) version from the
          # requested source. This is reported in the release body regardless
          # of whether the desktop version is overridden.
          SOURCE="${{ inputs.version_source || 'github' }}"
          echo "Resolving sidecar version from: $SOURCE"
          case "$SOURCE" in
            pypi)
              SIDECAR_VERSION=$(curl -s https://pypi.org/pypi/get-physics-done/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
              ;;
            github)
              SIDECAR_VERSION=$(gh api repos/psi-oss/get-physics-done/contents/pyproject.toml --jq '.content' | base64 -d | grep '^version' | head -1 | grep -oP '"\K[^"]+')
              ;;
            npm)
              SIDECAR_VERSION=$(curl -s https://registry.npmjs.org/get-physics-done | python3 -c "import sys,json; print(json.load(sys.stdin)['dist-tags']['latest'])")
              ;;
          esac
          echo "Sidecar version (get-physics-done): $SIDECAR_VERSION"

          # Desktop version can be overridden independently of the sidecar so
          # desktop-only patch releases can ship (the auto-updater only
          # promotes a proper semver increase, so -N pre-release suffixes
          # cannot be used to reach existing installs).
          if [ -n "${{ inputs.version }}" ]; then
            BASE_VERSION="${{ inputs.version }}"
            RESOLVE_SOURCE="manual"
            echo "Desktop version override: $BASE_VERSION"
          else
            BASE_VERSION="$SIDECAR_VERSION"
            RESOLVE_SOURCE="$SOURCE"
            echo "Desktop version follows sidecar: $BASE_VERSION"
          fi

          REPO="${{ github.repository }}"
          CANDIDATE="$BASE_VERSION"
          RESOLVED=""
          for N in {0..100}; do
            if [ "$N" -eq 0 ]; then
              CANDIDATE="$BASE_VERSION"
            else
              CANDIDATE="$BASE_VERSION-$N"
            fi
            TAG="gpd-desktop-v$CANDIDATE"
            if RJ=$(gh api "repos/$REPO/releases/tags/$TAG" 2>/dev/null); then
              IS_DRAFT=$(printf '%s' "$RJ" | python3 -c "import sys,json; print(json.load(sys.stdin).get('draft', False))")
              if [ "$IS_DRAFT" = "True" ]; then
                echo "Draft release $TAG exists; will add assets to it."
                RESOLVED="$CANDIDATE"
                break
              fi
              echo "Tag $TAG is already published; trying next suffix."
            else
              echo "Tag $TAG does not exist; will create a fresh draft."
              RESOLVED="$CANDIDATE"
              break
            fi
          done

          if [ -z "$RESOLVED" ]; then
            echo "::error::Exhausted -N suffixes 1..100 for $BASE_VERSION. Pass an explicit version input."
            exit 1
          fi
          CANDIDATE="$RESOLVED"

          VERSION="$CANDIDATE"
          echo "Resolved desktop release: $VERSION (tag: gpd-desktop-v$VERSION, base: $BASE_VERSION, sidecar: $SIDECAR_VERSION, source: $RESOLVE_SOURCE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sidecar_version=$SIDECAR_VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$RESOLVE_SOURCE" >> "$GITHUB_OUTPUT"

  build-cli:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install
      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist/opencode-*

  build-desktop:
    needs: [resolve-version, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm
          - host: macos-latest
            target: x86_64-apple-darwin
            label: mac-intel
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install

      - name: Prepare sidecars
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENCODE_CLI_ARTIFACT: opencode-cli

      - name: Download uv binary
        shell: bash
        run: |
          UV_VERSION="0.7.3"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)      UV_PLATFORM="aarch64-apple-darwin" ;;
            x86_64-apple-darwin)       UV_PLATFORM="x86_64-apple-darwin" ;;
            x86_64-pc-windows-msvc)    UV_PLATFORM="x86_64-pc-windows-msvc" ;;
            x86_64-unknown-linux-gnu)  UV_PLATFORM="x86_64-unknown-linux-gnu" ;;
          esac
          mkdir -p packages/desktop/src-tauri/uv-bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_PLATFORM}.zip" -o /tmp/uv.zip
            unzip /tmp/uv.zip -d packages/desktop/src-tauri/uv-bundle
          else
            curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_PLATFORM}.tar.gz" \
              | tar xz -C packages/desktop/src-tauri/uv-bundle --strip-components=1
          fi
          chmod +x packages/desktop/src-tauri/uv-bundle/uv 2>/dev/null || true
          echo "uv binary staged: $(du -sh packages/desktop/src-tauri/uv-bundle | cut -f1)"

      # Linux AppImage workaround (same as upstream publish.yml)
      - name: Resolve tauri portable SHA
        if: runner.os == 'Linux'
        run: echo "TAURI_PORTABLE_SHA=$(git ls-remote https://github.com/tauri-apps/tauri.git refs/heads/feat/truly-portable-appimage | cut -f1)" >> "$GITHUB_ENV"

      - name: Install tauri-cli from portable appimage branch
        uses: taiki-e/cache-cargo-install-action@v3
        if: runner.os == 'Linux'
        with:
          tool: tauri-cli
          git: https://github.com/tauri-apps/tauri
          rev: ${{ env.TAURI_PORTABLE_SHA }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          tauriScript: ${{ (runner.os == 'Linux' && 'cargo tauri') || '' }}
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json
          tagName: gpd-desktop-v${{ needs.resolve-version.outputs.version }}
          releaseName: "GPD v${{ needs.resolve-version.outputs.version }}"
          releaseBody: |
            GPD Desktop App v${{ needs.resolve-version.outputs.version }} — Physics Research Workspace by PSI

            **Bundled sidecar:** get-physics-done v${{ needs.resolve-version.outputs.sidecar_version }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
