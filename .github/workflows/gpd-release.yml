name: GPD Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (leave empty to auto-detect)"
        required: false
        type: string
      version_source:
        description: "Where to read version from (ignored if version is set)"
        required: false
        type: choice
        default: github
        options:
          - github
          - pypi
          - npm
      skip_platforms:
        description: "Comma-separated platform labels to skip (mac-arm,mac-intel,windows,linux)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            SOURCE="${{ inputs.version_source || 'pypi' }}"
            echo "Auto-detecting version from: $SOURCE"
            case "$SOURCE" in
              pypi)
                VERSION=$(curl -s https://pypi.org/pypi/get-physics-done/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
                ;;
              github)
                VERSION=$(gh api repos/psi-oss/get-physics-done/contents/pyproject.toml --jq '.content' | base64 -d | grep '^version' | head -1 | grep -oP '"\K[^"]+')
                ;;
              npm)
                VERSION=$(curl -s https://registry.npmjs.org/get-physics-done | python3 -c "import sys,json; print(json.load(sys.stdin)['dist-tags']['latest'])")
                ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE:-manual}" >> "$GITHUB_OUTPUT"
          echo "Resolved GPD version: $VERSION (source: ${SOURCE:-manual})"

          TAG="gpd-desktop-v$VERSION"
          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null || echo '')
          if [ -n "$RELEASE_JSON" ]; then
            IS_DRAFT=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['draft'])")
            if [ "$IS_DRAFT" = "False" ]; then
              echo "::error::Tag $TAG already exists as a PUBLISHED release. Bump the version in get-physics-done pyproject.toml or pass an explicit 'version' input."
              exit 1
            fi
            echo "::notice::Draft release for $TAG already exists; assets will be added to it."
          fi

  build-cli:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install
      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist/opencode-*

  build-desktop:
    needs: [resolve-version, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm
          - host: macos-latest
            target: x86_64-apple-darwin
            label: mac-intel
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    if: ${{ !contains(format(',{0},', inputs.skip_platforms), format(',{0},', matrix.label)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install

      - name: Prepare sidecars
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENCODE_CLI_ARTIFACT: opencode-cli

      - name: Download uv binary
        shell: bash
        run: |
          UV_VERSION="0.7.3"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)      UV_PLATFORM="aarch64-apple-darwin" ;;
            x86_64-apple-darwin)       UV_PLATFORM="x86_64-apple-darwin" ;;
            x86_64-pc-windows-msvc)    UV_PLATFORM="x86_64-pc-windows-msvc" ;;
            x86_64-unknown-linux-gnu)  UV_PLATFORM="x86_64-unknown-linux-gnu" ;;
          esac
          mkdir -p packages/desktop/src-tauri/uv-bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_PLATFORM}.zip" -o /tmp/uv.zip
            unzip /tmp/uv.zip -d packages/desktop/src-tauri/uv-bundle
          else
            curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_PLATFORM}.tar.gz" \
              | tar xz -C packages/desktop/src-tauri/uv-bundle --strip-components=1
          fi
          chmod +x packages/desktop/src-tauri/uv-bundle/uv 2>/dev/null || true
          echo "uv binary staged: $(du -sh packages/desktop/src-tauri/uv-bundle | cut -f1)"

      # Linux AppImage workaround (same as upstream publish.yml)
      - name: Resolve tauri portable SHA
        if: runner.os == 'Linux'
        run: echo "TAURI_PORTABLE_SHA=$(git ls-remote https://github.com/tauri-apps/tauri.git refs/heads/feat/truly-portable-appimage | cut -f1)" >> "$GITHUB_ENV"

      - name: Install tauri-cli from portable appimage branch
        uses: taiki-e/cache-cargo-install-action@v3
        if: runner.os == 'Linux'
        with:
          tool: tauri-cli
          git: https://github.com/tauri-apps/tauri
          rev: ${{ env.TAURI_PORTABLE_SHA }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          tauriScript: ${{ (runner.os == 'Linux' && 'cargo tauri') || '' }}
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json
          tagName: gpd-desktop-v${{ needs.resolve-version.outputs.version }}
          releaseName: "GPD v${{ needs.resolve-version.outputs.version }}"
          releaseBody: "GPD Desktop App v${{ needs.resolve-version.outputs.version }} — Physics Research Workspace by PSI"
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
