name: GPD release-build smoke
on:
  schedule:
    - cron: '7 4 * * 1'  # weekly Monday 04:07 UTC
  workflow_dispatch:

concurrency:
  group: gpd-tests-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Release-build smoke (inc.psi.gpd)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTEST_CI: "1"
      PYTEST_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: aarch64-apple-darwin-release

      - uses: astral-sh/setup-uv@v6
        with:
          uv-version: "0.7.3"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build opencode sidecar
        working-directory: packages/desktop
        run: bun run predev
        env:
          RUST_TARGET: aarch64-apple-darwin
          TAURI_ENV_TARGET_TRIPLE: aarch64-apple-darwin

      - name: Stage uv bundle
        shell: bash
        run: |
          UV_PLATFORM="aarch64-apple-darwin"
          mkdir -p packages/desktop/src-tauri/uv-bundle
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/0.7.3/uv-${UV_PLATFORM}.tar.gz" \
            | tar xz -C packages/desktop/src-tauri/uv-bundle --strip-components=1
          chmod +x packages/desktop/src-tauri/uv-bundle/uv

      # Release build — unsigned. `tauri.prod.conf.json` identifier=inc.psi.gpd,
      # productName=GPD. No signing/notarization means the .app won't run on a
      # strict gatekeeper, but we only need the bundle layout + frontend dist
      # for the release_no_mcp tests.
      - name: Build RELEASE Tauri bundle (unsigned)
        working-directory: packages/desktop
        run: bun run tauri build --config ./src-tauri/tauri.prod.conf.json --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve release bundle path
        shell: bash
        run: |
          BUNDLE_ROOT="packages/desktop/src-tauri/target"
          BUNDLE=""
          for candidate in \
            "$BUNDLE_ROOT/aarch64-apple-darwin/release/bundle/macos/GPD.app" \
            "$BUNDLE_ROOT/release/bundle/macos/GPD.app"; do
            if [ -e "$candidate/Contents/MacOS" ]; then
              BUNDLE="$candidate"
              break
            fi
          done
          if [ -z "$BUNDLE" ]; then
            echo "::warning::No release .app produced — running frontend-only half of release tests"
            BUNDLE=""
          fi
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Install test dependencies
        working-directory: packages/desktop/tests-gui
        run: uv sync

      - name: Run release-only smoke tests
        working-directory: packages/desktop/tests-gui
        env:
          GPD_APP_PATH: ${{ env.BUNDLE }}
        run: |
          uv run pytest tests/smoke/test_release_no_mcp.py -v -m smoke \
            --junitxml=junit-release.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-release
          path: packages/desktop/tests-gui/junit-release.xml
          retention-days: 30
          if-no-files-found: ignore
