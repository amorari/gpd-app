name: GPD Desktop Publish Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. gpd-desktop-v1.2.0). Leave empty to pick the newest draft."
        required: false
        type: string
      mark_latest:
        description: "Mark the published release as 'latest'"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  # actions: write is required for the "Refresh download page" step to
  # dispatch gpd-download-page.yml via the GITHUB_TOKEN. Without it,
  # that step fails with HTTP 403 and download.gpd.psi.inc stays on
  # the prior release while the in-app updater already sees the new
  # one.
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"

          # Use gh CLI throughout. Draft releases do not have an underlying
          # git tag ref until publish, so the raw API GET /releases/tags/<tag>
          # endpoint returns 404 for them — that path is only usable after
          # the draft is published. gh CLI's `release list/view/edit` all
          # resolve drafts correctly (they fan out to /releases and match on
          # tag_name themselves).
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --limit 100 \
              --json tagName,isDraft,createdAt \
              --jq '[.[] | select(.isDraft == true and (.tagName | startswith("gpd-desktop-v")))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
            if [ -z "$TAG" ]; then
              echo "::error::No draft gpd-desktop-v* release found in the most recent 100."
              exit 1
            fi
            echo "Selected newest draft tag: $TAG"
          fi

          META=$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets,databaseId)
          IS_DRAFT=$(echo "$META" | python3 -c "import sys,json; print(json.load(sys.stdin)['isDraft'])")
          ASSET_COUNT=$(echo "$META" | python3 -c "import sys,json; print(len(json.load(sys.stdin)['assets']))")
          RELEASE_ID=$(echo "$META" | python3 -c "import sys,json; print(json.load(sys.stdin)['databaseId'])")
          echo "Release: $TAG  id=$RELEASE_ID  draft=$IS_DRAFT  assets=$ASSET_COUNT"

          if [ "$IS_DRAFT" != "True" ]; then
            echo "::warning::$TAG is already published; no action taken."
            exit 0
          fi
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::$TAG has no assets uploaded yet; refusing to publish."
            exit 1
          fi

          MARK_LATEST_ARG=""
          if [ "${{ inputs.mark_latest }}" = "true" ]; then
            MARK_LATEST_ARG="--latest"
          fi
          gh release edit "$TAG" --draft=false $MARK_LATEST_ARG --repo "$REPO"
          echo "Published $TAG (id=$RELEASE_ID)"

      - name: Refresh download page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Draft-flip (`gh release edit --draft=false`) does NOT fire the
          # `release:published` webhook — that event only fires when a
          # release is created with draft=false. Without this dispatch,
          # gpd-download-page.yml would never run for draft-flipped
          # releases, and download.gpd.psi.inc would stay on the prior
          # version while the updater already sees the new one.
          gh workflow run gpd-download-page.yml --repo "$REPO" --ref gpd
          echo "Dispatched gpd-download-page.yml"
