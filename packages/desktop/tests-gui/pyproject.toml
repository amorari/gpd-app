[project]
name = "opencode-gpd-test"
version = "0.1.0"
description = "GUI test suite for GPD.app"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.0,<10",
    "pytest-html>=4.1,<5",
    "pytest-rerunfailures>=14.0,<17",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
    "rich>=13.7,<16",
    "anyio>=4.0,<5",
    "hypothesis>=6.152.1",
]

[project.optional-dependencies]
visual = ["pillow>=10.0", "imagehash>=4.3"]
dev = ["pytest-cov>=5.0", "hypothesis>=6.100,<7", "mutmut>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpd_tests"]
