[project]
name = "opencode-gpd-test"
version = "0.1.0"
description = "GUI test suite for GPD.app"
# CI runs Python 3.13 exclusively; 3.12 is not tested in any job.
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.0,<10",
    "pytest-html>=4.1,<5",
    "pytest-rerunfailures>=14.0,<17",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
    "rich>=13.7,<16",
    # anyio is a de-facto required transitive dep from httpx>=0.28; declared
    # explicitly so it's pinned in uv.lock and version changes are visible.
    "anyio>=4.0,<5",
]

# visual = ["pillow>=10.0", "imagehash>=4.3"]  # (removed: no current tests use it)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpd_tests"]
