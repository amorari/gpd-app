[pytest]
testpaths = tests tests_unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast unit test (no GPD required)
    smoke: Phase 1 smoke test (requires GPD)
    # restart and steals_focus are excluded by default via addopts; opt in explicitly.
    # Note: -m smoke on the CLI combines with the addopts -m via AND, so
    #   pytest -m smoke  →  smoke AND (not steals_focus) AND (not restart)
    restart: destructive — physically restarts GPD (brief focus steal). Opt in with `-m restart`.
    steals_focus: test brings GPD to the foreground (⌘-shortcuts, frontmost-required). Opt in with `-m steals_focus`.
    surfaces: Phase 2 surface test
    flows: Phase 3 flow test
    regression: Phase 4 regression test
    broad: Phase 5 broad menu/UI test (requires GPD)
    real_backend: requires live LLM API (guarded by GPD_TEST_ANTHROPIC_KEY)
    fresh_app: request a full (tier-2) reset before the test
    visual: screenshot-diff assertion (requires visual extras)
    tier(n): override reset tier for this test (0-3)
    harness_selftest: harness invariant test (runs first; others suspect if these fail)
addopts =
    -ra
    --strict-markers
    --timeout-method=thread
    -m "not steals_focus and not restart"
# timeout applies to every test; --timeout=60 is NOT repeated in addopts (redundant).
# For real_backend in CI, pass --reruns 2 on the command line.
timeout = 60
reruns = 0
log_cli = false
log_cli_level = INFO
